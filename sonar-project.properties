# =============================================================================
# CONFIGURACIÓN DE ANÁLISIS DE CALIDAD Y SEGURIDAD - SONARQUBE
# =============================================================================

sonar.projectKey=colegio-bo-platform
sonar.projectName=Colegio BO - Plataforma de Gestión Escolar
sonar.projectVersion=1.0.0

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Directorios de código fuente (Backend Microservicios + Frontend React)
sonar.sources=Encargo-Colegio-BO-Backend-main/apigateway/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-usuarios/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-asistencia/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-matricula/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-academico/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-reportes/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-mensajeria/src/main/java,\
              Encargo-Colegio-BO-Backend-main/servicio-rabbitmq-admin/src/main/java,\
              front/src

# Directorios de pruebas unitarias y de integración
sonar.tests=Encargo-Colegio-BO-Backend-main/apigateway/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-usuarios/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-asistencia/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-matricula/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-academico/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-reportes/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-mensajeria/src/test/java,\
            Encargo-Colegio-BO-Backend-main/servicio-rabbitmq-admin/src/test/java

# Binarios compilados de Java (Bytecode para análisis de bytecode)
sonar.java.binaries=Encargo-Colegio-BO-Backend-main/**/target/classes

# Exclusiones de librerías y dependencias
sonar.exclusions=**/node_modules/**,\
                 **/target/**,\
                 **/.mvn/**,\
                 **/dist/**,\
                 tests/e2e/screenshots/**

# Perfil de Calidad y Reglas
sonar.qualitygate.wait=false

